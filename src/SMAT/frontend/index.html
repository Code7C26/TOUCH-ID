<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5b800" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DROID-E3D by SMAT · Seguridad que recorre la planta</title>
    <meta name="description" content="DROID-E3D es un robot que recorre la fábrica, detecta con IA a quien trabaja sin casco, guantes, lentes o chaleco, avisa al instante y detiene la máquina de esa zona." />
    <!-- Vista previa al compartir el enlace (WhatsApp, LinkedIn) -->
    <meta property="og:title" content="DROID-E3D by SMAT · Seguridad que recorre la planta" />
    <meta property="og:description" content="Robot con IA que controla el uso del equipo de protección en la fábrica y detiene la máquina si hace falta." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/capturas/panel-claro.webp" />
    <script>
      // Aplica el tema guardado ANTES de dibujar la página, para que no "parpadee" en blanco.
      try {
        const guardado = localStorage.getItem('tema')
        const oscuro = guardado ? guardado === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches
        if (oscuro) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
